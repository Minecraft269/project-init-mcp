name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Node 20 已 EOL（2026-04），不再浪费 runner 时间测它；
        # 24 是当前本地开发版本。
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci

      # 测试会在系统临时目录里建 git 仓库，需要 git 身份
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"

      # 从源码编译 aoci —— 和本地用法一致（Release 全是 pre-release，落后主干）。
      # 代价：CI 现在跟着上游 main 走，上游改坏了我们就会红。真出现时把 AOCI_REF
      # 固定成某个 tag/分支再排查，不用改结构。
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: 编译 aoci-code（源码）
        shell: bash
        env:
          AOCI_REF: main
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$AOCI_REF" https://github.com/aoci-spec/aoci-code "$RUNNER_TEMP/aoci-src"
          echo "aoci 源码: $AOCI_REF @ $(git -C "$RUNNER_TEMP/aoci-src" rev-parse --short HEAD)"
          mkdir -p "$RUNNER_TEMP/bin"
          OUT="$RUNNER_TEMP/bin/aoci"
          if [ "$RUNNER_OS" = "Windows" ]; then OUT="$OUT.exe"; fi
          ( cd "$RUNNER_TEMP/aoci-src" && go build -trimpath -o "$OUT" ./cmd/aoci )
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # 装不上就当场红，别让它悄悄退回"跳过"分支
      - name: 确认 aoci 可用
        run: aoci --version

      - name: 跑测试
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/test.log"
          # aoci 已经在 PATH 上还出现"跳过用例"，说明它没真正参与验证
          if grep -q "skip 用例" "$RUNNER_TEMP/test.log"; then
            echo "::error::存在被跳过的用例 —— aoci 没有真正参与验证"
            grep "skip 用例" "$RUNNER_TEMP/test.log"
            exit 1
          fi

