version: 2
updates:
  # 依赖升级：唯一运行时依赖是 MCP SDK，devDependencies 只有 eslint
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development

  # actions 版本升级（checkout/setup-node/codeql-action 等）
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
